name: Sync fork

on:
  schedule:
    # 03:00 Beijing time, 19:00 UTC.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(gh repo sync ${{ github.repository }} --branch master 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if echo "$output" | grep -q "can't sync because there are diverging changes"; then
            echo "Fork has diverging changes; skipping sync."
            exit 0
          fi

          exit "$status"
